<!DOCTYPE html>
<html lang="ko">
<head>

<title>엄마의 골프 캘린더</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

  tailwind.config = {

        colors: {
          fairway: { 900: '#12331F', 800: '#17402A', 700: '#1E5233', 600: '#2C6B45', 500: '#3C8757', 300: '#7FB069' },
          sand: { 100: '#FBF6EA', 200: '#F3E9D2', 300: '#E3D3AE' },

        },

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.9/babel.min.js"></script>

<style>
  /* 골프장 페어웨이 배경: 하늘빛 → 잔디 그라데이션 + 잔디 깎은 줄무늬 + 골프공 딤플 */
  html { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100dvh;
    color: #132119;
    background-color: #17402A;
    background-image:
      radial-gradient(130% 55% at 50% -12%, rgba(168, 213, 229, 0.75) 0%, rgba(168, 213, 229, 0) 62%),
      radial-gradient(80% 40% at 88% 6%, rgba(255, 246, 214, 0.5) 0%, rgba(255, 246, 214, 0) 55%),
      repeating-linear-gradient(114deg, rgba(255, 255, 255, 0.055) 0 30px, rgba(0, 0, 0, 0.055) 30px 60px),
      radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1.4px),
      linear-gradient(180deg, #2C6B45 0%, #1E5233 42%, #143A26 100%);
    background-size: auto, auto, auto, 14px 14px, auto;
    background-attachment: fixed;
  }
  .glass { background: rgba(251, 246, 234, 0.94); }
  .sheet-in { animation: sheetIn .26s cubic-bezier(.22,.9,.3,1); }
  @keyframes sheetIn { from { transform: translateY(18px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
  .fade-in { animation: fadeIn .2s ease-out; }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  .no-tap-flash { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid #C0392B; outline-offset: 2px; border-radius: 10px; }
  @media (prefers-reduced-motion: reduce) {
    .sheet-in, .fade-in { animation: none; }
  }
</style>

<body class="font-body antialiased">
<div id="root"></div>

<script type="text/babel">
// ========================================
// React Hooks
// ========================================
const { useState, useEffect, useMemo, useCallback } = React;

// ========================================
// 상수 · 유틸리티
// ========================================
const STORAGE_KEY = 'mom-golf-calendar-v1';
const CITY_KEY = 'mom-golf-calendar-city-v1';
const OWM_KEY = 'de07bc513674323ffa95528c29e2dd60';
const START_YEAR = 2026;
const START_MONTH = 8; // 0-index → 2026년 9월

const CITIES = [
  { q: 'Seoul',     label: '서울' },
  { q: 'Suwon',     label: '수원·경기' },
  { q: 'Incheon',   label: '인천' },
  { q: 'Chuncheon', label: '춘천·강원' },
  { q: 'Cheonan',   label: '천안·충남' },
  { q: 'Daejeon',   label: '대전' },
  { q: 'Daegu',     label: '대구' },
  { q: 'Gwangju',   label: '광주' },
  { q: 'Busan',     label: '부산' },
  { q: 'Jeju',      label: '제주' }
];

const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
const TRANSPORT = {
  car: { label: '차량', short: '차', emoji: '🚗' },
  bus: { label: '버스', short: '버스', emoji: '🚌' }
};

const pad = (n) => String(n).padStart(2, '0');
const ymd = (y, m, d) => y + '-' + pad(m + 1) + '-' + pad(d);
const todayKey = () => { const t = new Date(); return ymd(t.getFullYear(), t.getMonth(), t.getDate()); };

function formatKoreanDate(key) {
  const parts = key.split('-').map(Number);
  const dow = WEEKDAYS[new Date(parts[0], parts[1] - 1, parts[2]).getDay()];
  return parts[1] + '월 ' + parts[2] + '일 (' + dow + ')';
}

function daysBetween(fromKey, toKey) {
  const a = new Date(fromKey + 'T00:00:00');
  const b = new Date(toKey + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

function buildMonthGrid(year, month) {
  const startDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const prevDays = new Date(year, month, 0).getDate();
  const cells = [];
  for (let i = startDow - 1; i >= 0; i--) cells.push({ key: 'p' + i, day: prevDays - i, inMonth: false });
  for (let d = 1; d <= daysInMonth; d++) cells.push({ key: 'c' + d, day: d, inMonth: true, date: ymd(year, month, d) });
  let n = 1;
  while (cells.length % 7 !== 0) { cells.push({ key: 'n' + n, day: n, inMonth: false }); n++; }
  return cells;
}

function loadEvents() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}

// ========================================
// 🎨 Design System Components
// ========================================
function Button({ variant = 'primary', size = 'md', className = '', children, ...rest }) {
  const base = 'no-tap-flash inline-flex items-center justify-center gap-1.5 font-semibold rounded-2xl transition active:scale-[.97] disabled:opacity-40';
  const variants = {
    primary: 'bg-fairway-700 text-sand-100 shadow-lg shadow-fairway-900/25 hover:bg-fairway-600',
    secondary: 'bg-sand-200 text-fairway-800 hover:bg-sand-300',
    danger: 'bg-flag/10 text-flag hover:bg-flag/20',
    ghost: 'bg-transparent text-fairway-700 hover:bg-fairway-700/10'
  };
  const sizes = { sm: 'px-3 py-1.5 text-sm', md: 'px-4 py-2.5 text-[15px]', lg: 'px-5 py-3.5 text-base w-full' };
  return (
    <button className={base + ' ' + variants[variant] + ' ' + sizes[size] + ' ' + className} {...rest}>{children}</button>
  );
}

function Input({ label, hint, className = '', ...rest }) {
  return (
    <label className="block">
      {label && <span className="block mb-1.5 text-[13px] font-semibold tracking-wide text-fairway-700">{label}</span>}
      <input
        className={'w-full rounded-2xl border border-sand-300 bg-white px-4 py-3.5 text-[17px] text-ink placeholder:text-ink/35 focus:border-fairway-500 focus:ring-2 focus:ring-fairway-500/25 focus:outline-none ' + className}
        {...rest}
      />
      {hint && <span className="mt-1 block text-xs text-ink/50">{hint}</span>}
    </label>
  );
}

function Card({ className = '', children }) {
  return <div className={'glass rounded-3xl shadow-xl shadow-fairway-900/20 ' + className}>{children}</div>;
}

function Badge({ tone = 'green', className = '', children }) {
  const tones = {
    green: 'bg-fairway-700/10 text-fairway-800',
    red: 'bg-flag/10 text-flag',
    sand: 'bg-sand-300/70 text-fairway-800'
  };
  return <span className={'inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs font-semibold ' + tones[tone] + ' ' + className}>{children}</span>;
}

function Sheet({ isOpen, onClose, title, children }) {
  useEffect(() => {
    if (!isOpen) return;
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => { document.body.style.overflow = prev; window.removeEventListener('keydown', onKey); };
  }, [isOpen, onClose]);

  if (!isOpen) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center sm:items-center fade-in" role="dialog" aria-modal="true" aria-label={title}>
      <div className="absolute inset-0 bg-fairway-900/55 backdrop-blur-[2px]" onClick={onClose} />
      <div className="sheet-in relative w-full sm:max-w-md max-h-[92dvh] overflow-y-auto rounded-t-[28px] sm:rounded-[28px] bg-sand-100 px-5 pb-[max(1.5rem,env(safe-area-inset-bottom))] pt-3 shadow-2xl">
        <div className="mx-auto mb-3 h-1.5 w-11 rounded-full bg-fairway-800/15 sm:hidden" />
        <div className="mb-5 flex items-center justify-between">
          <h2 className="font-display text-xl font-bold text-fairway-800">{title}</h2>
          <button onClick={onClose} aria-label="닫기" className="no-tap-flash rounded-full p-2 text-fairway-800/50 hover:bg-fairway-800/10">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        {children}
      </div>
    </div>
  );
}

// ========================================
// 🌤 Weather Components
// ========================================
function WeatherIcon({ code = '01d', size = 18 }) {
  const g = code.slice(0, 2);
  const rays = [0, 45, 90, 135, 180, 225, 270, 315].map((a) => (
    <line key={a} x1="12" y1="3.4" x2="12" y2="5.6" stroke="#F2A93B" strokeWidth="2" strokeLinecap="round" transform={'rotate(' + a + ' 12 12)'} />
  ));
  const sun = <circle cx="12" cy="12" r="5.4" fill="#F2A93B" />;
  const cloud = (fill) => <path d="M9.5 25h12.2a5.1 5.1 0 0 0 .5-10.2 7.3 7.3 0 0 0-13.9 1.6A4.4 4.4 0 0 0 9.5 25z" fill={fill} />;
  const drops = (y) => [10, 15.5, 21].map((x, i) => (
    <line key={x} x1={x} y1={y} x2={x - 1.6} y2={y + 4.2} stroke="#3E86C4" strokeWidth="2.1" strokeLinecap="round" opacity={i === 1 ? 1 : 0.8} />
  ));

  if (g === '01') return <svg width={size} height={size} viewBox="0 0 32 32" fill="none" aria-hidden="true"><g transform="translate(4,4)">{rays}{sun}</g></svg>;
  if (g === '02') return <svg width={size} height={size} viewBox="0 0 32 32" fill="none" aria-hidden="true"><g transform="translate(-1,-2) scale(.8)">{rays}{sun}</g>{cloud('#DCE6EC')}</svg>;
  if (g === '03') return <svg width={size} height={size} viewBox="0 0 32 32" fill="none" aria-hidden="true">{cloud('#DCE6EC')}</svg>;
  if (g === '04') return <svg width={size} height={size} viewBox="0 0 32 32" fill="none" aria-hidden="true"><g opacity=".55" transform="translate(-4,-3) scale(.82)">{cloud('#B9C7D1')}</g>{cloud('#DCE6EC')}</svg>;
  if (g === '09') return <svg width={size} height={size} viewBox="0 0 32 32" fill="none" aria-hidden="true"><g transform="translate(0,-3)">{cloud('#C9D6DE')}</g>{drops(23)}</svg>;
  if (g === '10') return <svg width={size} height={size} viewBox="0 0 32 32" fill="none" aria-hidden="true"><g transform="translate(-1,-4) scale(.72)">{rays}{sun}</g><g transform="translate(0,-3)">{cloud('#DCE6EC')}</g>{drops(23)}</svg>;
  if (g === '11') return <svg width={size} height={size} viewBox="0 0 32 32" fill="none" aria-hidden="true"><g transform="translate(0,-3)">{cloud('#A9B8C3')}</g><path d="M17 20l-5.4 6.4h4L14.2 31l6-7h-4.1z" fill="#F2A93B" /></svg>;
  if (g === '13') return <svg width={size} height={size} viewBox="0 0 32 32" fill="none" aria-hidden="true"><g transform="translate(0,-3)">{cloud('#E4EDF2')}</g>{[10, 15.5, 21].map((x) => <circle key={x} cx={x} cy="25.5" r="1.6" fill="#7FB6D9" />)}</svg>;
  return <svg width={size} height={size} viewBox="0 0 32 32" fill="none" aria-hidden="true">{[8, 13, 18].map((y, i) => <line key={y} x1={5 + i} y1={y + 3} x2={27 - i} y2={y + 3} stroke="#AFBFC9" strokeWidth="2.3" strokeLinecap="round" />)}</svg>;
}

function WeatherChip({ weather, cityLabel }) {
  if (!weather) return null;
  return (
    <div className="flex items-center gap-2 rounded-full bg-white/15 px-3 py-1.5 backdrop-blur-sm">
      <WeatherIcon code={weather.icon} size={22} />
      <span className="text-[13px] font-semibold text-sand-100">{cityLabel} {Math.round(weather.max)}°</span>
      <span className="text-[13px] text-sand-100/70">{weather.desc}</span>
    </div>
  );
}

// ========================================
// 🗓 Calendar Components
// ========================================
function DayCell({ cell, event, weather, isToday, onSelect }) {
  if (!cell.inMonth) {
    return <div className="min-h-[68px] rounded-2xl bg-sand-200/25" aria-hidden="true" />;
  }
  const dow = new Date(cell.date + 'T00:00:00').getDay();
  const dateColor = dow === 0 ? 'text-flag' : dow === 6 ? 'text-[#2F6FA8]' : 'text-ink';
  const shell = event ? 'border-fairway-600/40 bg-fairway-500/10' : 'border-sand-300/60 bg-white/65';
  const todayRing = isToday ? 'ring-2 ring-flag ring-offset-1 ring-offset-sand-100' : '';

  return (
    <button
      onClick={() => onSelect(cell.date)}
      aria-label={formatKoreanDate(cell.date) + (event ? ' · ' + event.course : ' 일정 없음')}
      className={'no-tap-flash flex min-h-[68px] flex-col rounded-2xl border p-1.5 text-left transition active:scale-[.96] ' + shell + ' ' + todayRing}
    >
      <div className="flex items-start justify-between">
        <span className={'text-[13px] font-bold leading-none ' + dateColor}>{cell.day}</span>
        {weather && <WeatherIcon code={weather.icon} size={16} />}
      </div>

      {weather && (
        <div className="mt-0.5 text-[9.5px] font-semibold leading-none tabular-nums text-ink/55">
          {Math.round(weather.max)}° <span className="text-ink/35">{Math.round(weather.min)}°</span>
        </div>
      )}

      <div className="mt-auto w-full">
        {event && (
          <div className="rounded-lg bg-fairway-700 px-1 py-0.5 text-center">
            <div className="truncate text-[9.5px] font-bold leading-tight text-sand-100">{event.teeTime}</div>
            <div className="truncate text-[8.5px] leading-tight text-sand-100/75">{TRANSPORT[event.transport].short} · {event.course}</div>
          </div>
        )}
      </div>
    </button>
  );
}

function EventRow({ date, event, dday, onEdit }) {
  return (
    <button
      onClick={() => onEdit(date)}
      className="no-tap-flash flex w-full items-center gap-3 rounded-2xl bg-white/75 p-3 text-left transition active:scale-[.99] hover:bg-white"
    >
      <div className="flex w-12 shrink-0 flex-col items-center rounded-xl bg-fairway-700 py-1.5 text-sand-100">
        <span className="text-[10px] leading-none opacity-75">{Number(date.slice(5, 7))}월</span>
        <span className="font-display text-lg font-bold leading-tight">{Number(date.slice(8, 10))}</span>
      </div>
      <div className="min-w-0 flex-1">
        <div className="flex items-center gap-1.5">
          <span className="truncate font-semibold text-ink">{event.course}</span>
          {dday !== null && dday >= 0 && (
            <Badge tone={dday === 0 ? 'red' : 'sand'}>{dday === 0 ? '오늘' : 'D-' + dday}</Badge>
          )}
        </div>
        <div className="mt-0.5 flex items-center gap-2 text-[13px] text-ink/60">
          <span className="font-semibold tabular-nums text-fairway-700">티업 {event.teeTime}</span>
          <span aria-hidden="true">·</span>
          <span>{TRANSPORT[event.transport].emoji} {TRANSPORT[event.transport].label}</span>
        </div>
        {event.note && <div className="mt-0.5 truncate text-xs text-ink/45">{event.note}</div>}
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" className="shrink-0 text-ink/25"><path d="M9 5l7 7-7 7" /></svg>
    </button>
  );
}

// ========================================
// 📝 일정 입력 폼
// ========================================
function EventForm({ date, initial, onSave, onDelete, onCancel }) {
  const [course, setCourse] = useState(initial ? initial.course : '');
  const [teeTime, setTeeTime] = useState(initial ? initial.teeTime : '07:00');
  const [transport, setTransport] = useState(initial ? initial.transport : 'car');
  const [note, setNote] = useState(initial && initial.note ? initial.note : '');
  const [error, setError] = useState('');

  const submit = (e) => {
    e.preventDefault();
    if (!course.trim()) { setError('골프장 이름을 적어 주세요.'); return; }
    if (!teeTime) { setError('티업 시간을 정해 주세요.'); return; }
    onSave(date, { course: course.trim(), teeTime: teeTime, transport: transport, note: note.trim() });
  };

  return (
    <form onSubmit={submit} className="flex flex-col gap-4">
      <Input label="골프장 이름" value={course} onChange={(e) => { setCourse(e.target.value); setError(''); }} placeholder="예) 남서울CC" autoComplete="off" />
      <Input label="티업 시간" type="time" value={teeTime} onChange={(e) => { setTeeTime(e.target.value); setError(''); }} step="300" className="tabular-nums" />

      <div>
        <span className="mb-1.5 block text-[13px] font-semibold tracking-wide text-fairway-700">이동 방법</span>
        <div className="grid grid-cols-2 gap-2.5">
          {Object.keys(TRANSPORT).map((k) => (
            <button
              key={k}
              type="button"
              onClick={() => setTransport(k)}
              aria-pressed={transport === k}
              className={'no-tap-flash flex items-center justify-center gap-2 rounded-2xl border-2 py-3.5 text-[15px] font-semibold transition active:scale-[.97] ' +
                (transport === k ? 'border-fairway-600 bg-fairway-600 text-sand-100' : 'border-sand-300 bg-white text-ink/60')}
            >
              <span className="text-lg">{TRANSPORT[k].emoji}</span>{TRANSPORT[k].label}
            </button>
          ))}
        </div>
      </div>

      <Input label="메모 (선택)" value={note} onChange={(e) => setNote(e.target.value)} placeholder="예) 동반자 3명, 5시 30분 출발" autoComplete="off" />

      {error && <p role="alert" className="rounded-xl bg-flag/10 px-3 py-2 text-sm font-medium text-flag">{error}</p>}

      <div className="mt-1 flex flex-col gap-2">
        <Button type="submit" size="lg">저장하기</Button>
        <div className="flex gap-2">
          <Button type="button" variant="secondary" size="lg" onClick={onCancel}>취소</Button>
          {initial && <Button type="button" variant="danger" size="lg" onClick={() => onDelete(date)}>삭제</Button>}
        </div>
      </div>
    </form>
  );
}

// ========================================
// 🚀 App Component
// ========================================
function App() {
  const [events, setEvents] = useState(loadEvents);
  const [year, setYear] = useState(START_YEAR);
  const [month, setMonth] = useState(START_MONTH);
  const [selected, setSelected] = useState(null);
  const [city, setCity] = useState(() => localStorage.getItem(CITY_KEY) || 'Seoul');
  const [weather, setWeather] = useState({});
  const [weatherState, setWeatherState] = useState('loading'); // loading | ready | error

  const today = todayKey();

  // --- 일정 저장 ---
  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(events)); } catch (e) {}
  }, [events]);

  useEffect(() => {
    try { localStorage.setItem(CITY_KEY, city); } catch (e) {}
  }, [city]);

  // --- 날씨 불러오기 (OpenWeather 5일 / 3시간 예보) ---
  useEffect(() => {
    let cancelled = false;
    setWeatherState('loading');
    fetch('https://api.openweathermap.org/data/2.5/forecast?q=' + city + ',KR&units=metric&lang=kr&appid=' + OWM_KEY)
      .then((res) => { if (!res.ok) throw new Error('weather'); return res.json(); })
      .then((data) => {
        if (cancelled) return;
        const byDate = {};
        (data.list || []).forEach((item) => {
          const key = item.dt_txt.slice(0, 10);
          const hour = Number(item.dt_txt.slice(11, 13));
          if (!byDate[key]) {
            byDate[key] = { min: item.main.temp_min, max: item.main.temp_max, icon: '01d', desc: '', bestGap: 99 };
          }
          const slot = byDate[key];
          slot.min = Math.min(slot.min, item.main.temp_min);
          slot.max = Math.max(slot.max, item.main.temp_max);
          const gap = Math.abs(hour - 12);
          if (gap < slot.bestGap) {
            slot.bestGap = gap;
            slot.icon = item.weather[0].icon.replace('n', 'd');
            slot.desc = item.weather[0].description;
          }
        });
        setWeather(byDate);
        setWeatherState('ready');
      })
      .catch(() => { if (!cancelled) { setWeather({}); setWeatherState('error'); } });
    return () => { cancelled = true; };
  }, [city]);

  // --- 파생 값 ---
  const cells = useMemo(() => buildMonthGrid(year, month), [year, month]);
  const cityLabel = useMemo(() => (CITIES.find((c) => c.q === city) || CITIES[0]).label, [city]);

  const monthEvents = useMemo(() => {
    const prefix = year + '-' + pad(month + 1);
    return Object.keys(events).filter((k) => k.indexOf(prefix) === 0).sort().map((k) => ({ date: k, event: events[k] }));
  }, [events, year, month]);

  const nextRound = useMemo(() => {
    const upcoming = Object.keys(events).filter((k) => k >= today).sort();
    if (!upcoming.length) return null;
    return { date: upcoming[0], event: events[upcoming[0]], dday: daysBetween(today, upcoming[0]) };
  }, [events, today]);

  // --- 액션 ---
  const goMonth = useCallback((delta) => {
    const d = new Date(year, month + delta, 1);
    setYear(d.getFullYear());
    setMonth(d.getMonth());
  }, [year, month]);

  const goToday = useCallback(() => {
    const t = new Date();
    setYear(t.getFullYear());
    setMonth(t.getMonth());
  }, []);

  const saveEvent = useCallback((date, value) => {
    setEvents((prev) => Object.assign({}, prev, { [date]: value }));
    setSelected(null);
  }, []);

  const removeEvent = useCallback((date) => {
    if (!window.confirm('이 날의 골프 일정을 지울까요?')) return;
    setEvents((prev) => { const next = Object.assign({}, prev); delete next[date]; return next; });
    setSelected(null);
  }, []);

  return (
    <div className="mx-auto flex min-h-[100dvh] w-full max-w-md flex-col px-3 pb-10 pt-[max(1rem,env(safe-area-inset-top))]">

      {/* ---------- 헤더 ---------- */}
      <header className="px-2 pb-4">
        <div className="flex items-center gap-2">
          <span className="text-2xl" aria-hidden="true">⛳</span>
          <h1 className="font-display text-2xl font-bold tracking-tight text-sand-100">엄마의 골프 캘린더</h1>
        </div>
        <div className="mt-3 flex flex-wrap items-center gap-2">
          <label className="relative">
            <span className="sr-only">날씨 지역</span>
            <select
              value={city}
              onChange={(e) => setCity(e.target.value)}
              className="appearance-none rounded-full bg-white/15 py-1.5 pl-3 pr-7 text-[13px] font-semibold text-sand-100 backdrop-blur-sm focus:outline-none"
            >
              {CITIES.map((c) => <option key={c.q} value={c.q} className="text-ink">{c.label}</option>)}
            </select>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" className="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 text-sand-100/70"><path d="M6 9l6 6 6-6" /></svg>
          </label>
          {weatherState === 'ready' && weather[today] && <WeatherChip weather={weather[today]} cityLabel={cityLabel} />}
          {weatherState === 'loading' && <span className="rounded-full bg-white/10 px-3 py-1.5 text-[13px] text-sand-100/70">날씨 불러오는 중…</span>}
          {weatherState === 'error' && <span className="rounded-full bg-white/10 px-3 py-1.5 text-[13px] text-sand-100/70">날씨를 못 불러왔어요</span>}
        </div>
      </header>

      {/* ---------- 다음 라운딩 ---------- */}
      {nextRound && (
        <div className="mb-3 flex items-center gap-3 rounded-3xl border border-sand-100/20 bg-fairway-900/35 px-4 py-3 backdrop-blur-sm">
          <div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-flag text-sand-100">
            <span className="font-display text-[15px] font-bold leading-none">{nextRound.dday === 0 ? '오늘' : 'D-' + nextRound.dday}</span>
          </div>
          <div className="min-w-0">
            <div className="truncate text-[15px] font-semibold text-sand-100">{nextRound.event.course}</div>
            <div className="text-[13px] text-sand-100/70">
              {formatKoreanDate(nextRound.date)} · 티업 {nextRound.event.teeTime} · {TRANSPORT[nextRound.event.transport].label}
            </div>
          </div>
        </div>
      )}

      {/* ---------- 달력 ---------- */}
      <Card className="p-3.5">
        <div className="mb-3 flex items-center justify-between px-1">
          <button onClick={() => goMonth(-1)} aria-label="이전 달" className="no-tap-flash rounded-full p-2.5 text-fairway-700 hover:bg-fairway-700/10 active:scale-90">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M15 5l-7 7 7 7" /></svg>
          </button>
          <div className="text-center">
            <div className="font-display text-[26px] font-bold leading-none text-fairway-800">{year}년 {month + 1}월</div>
            <button onClick={goToday} className="mt-1 text-[11px] font-semibold text-fairway-600 underline underline-offset-2">오늘로</button>
          </div>
          <button onClick={() => goMonth(1)} aria-label="다음 달" className="no-tap-flash rounded-full p-2.5 text-fairway-700 hover:bg-fairway-700/10 active:scale-90">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M9 5l7 7-7 7" /></svg>
          </button>
        </div>

        <div className="mb-1.5 grid grid-cols-7 gap-1">
          {WEEKDAYS.map((w, i) => (
            <div key={w} className={'text-center text-[11px] font-bold ' + (i === 0 ? 'text-flag' : i === 6 ? 'text-[#2F6FA8]' : 'text-ink/45')}>{w}</div>
          ))}
        </div>

        <div className="grid grid-cols-7 gap-1">
          {cells.map((cell) => (
            <DayCell
              key={cell.key}
              cell={cell}
              event={cell.inMonth ? events[cell.date] : null}
              weather={cell.inMonth ? weather[cell.date] : null}
              isToday={cell.inMonth && cell.date === today}
              onSelect={setSelected}
            />
          ))}
        </div>

        <p className="mt-3 text-center text-[11px] leading-relaxed text-ink/40">날짜를 누르면 일정을 넣거나 고칠 수 있어요<br />날씨는 오늘부터 5일까지 표시돼요</p>
      </Card>

      {/* ---------- 이 달의 일정 ---------- */}
      <section className="mt-4">
        <h2 className="mb-2 px-2 font-display text-lg font-bold text-sand-100">{month + 1}월 일정 <span className="text-sand-100/50">{monthEvents.length}</span></h2>
        {monthEvents.length === 0 ? (
          <div className="rounded-3xl border border-dashed border-sand-100/30 px-4 py-8 text-center">
            <div className="mb-1 text-2xl" aria-hidden="true">🏌️</div>
            <p className="text-[14px] leading-relaxed text-sand-100/70">아직 잡힌 일정이 없어요.<br />달력에서 날짜를 눌러 첫 라운딩을 넣어 보세요.</p>
          </div>
        ) : (
          <div className="flex flex-col gap-2">
            {monthEvents.map((row) => (
              <EventRow key={row.date} date={row.date} event={row.event} dday={row.date >= today ? daysBetween(today, row.date) : null} onEdit={setSelected} />
            ))}
          </div>
        )}
      </section>

      <p className="mt-6 px-2 text-center text-[11px] leading-relaxed text-sand-100/45">
        입력한 일정은 이 휴대폰 브라우저에 저장돼요<br />날씨 자료 · OpenWeather
      </p>

      {/* ---------- 일정 입력 시트 ---------- */}
      <Sheet isOpen={!!selected} onClose={() => setSelected(null)} title={selected ? formatKoreanDate(selected) : ''}>
        {selected && (
          <div>
            {weather[selected] && (
              <div className="mb-4 flex items-center gap-3 rounded-2xl bg-white/70 px-4 py-3">
                <WeatherIcon code={weather[selected].icon} size={34} />
                <div>
                  <div className="text-[15px] font-semibold text-ink">{weather[selected].desc}</div>
                  <div className="text-[13px] tabular-nums text-ink/55">최고 {Math.round(weather[selected].max)}° · 최저 {Math.round(weather[selected].min)}°</div>
                </div>
              </div>
            )}
            <EventForm
              key={selected}
              date={selected}
              initial={events[selected]}
              onSave={saveEvent}
              onDelete={removeEvent}
              onCancel={() => setSelected(null)}
            />
          </div>
        )}
      </Sheet>
    </div>
  );
}

// ========================================
// Rendering
// ========================================
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
